name: Test Data Generator

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deployEnv:
        description: "Generate test data for: dev or test environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - test

      deployFolder:
        description: "Subfolder to generate test data:"
        required: true
        default: test-resources
        type: string

      rowCount:
        description: "Number of test data rows to generate:"
        required: true
        default: 100
        type: number

permissions:
  id-token: write
  contents: read

jobs:
  run-kotlin-job:
    name: Generate test data in ${{ inputs.deployEnv || 'dev' }} env
    environment: ${{ inputs.deployEnv || 'dev' }}
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Step 2: Set up Java (Required by the Kotlin Compiler)
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Step 3: Install Kotlin Compiler on the runner
      - name: Set up Kotlin
        uses: fwilhe2/setup-kotlin@b325539ca8f6e1d9ee04efed06f49bdbf5426dbb # v2.1

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_NUMBER }}:role/dpr-dpd-table-github-deploy-role
          role-session-name: githubactionsrolesession
          aws-region: eu-west-2

      - name: Generate SQL
        id: generate_sql
        env:
          DPD_TEST_RESOURCES_PATH: dpd/${{ inputs.deployEnv || 'dev' }}/definitions/prisons/${{ inputs.deployFolder || 'test-resources' }}
          TEST_DATA_ROW_COUNT: ${{ inputs.rowCount || 100 }}
          TEST_DATA_S3_PATH: ${{ inputs.deployEnv == 'test' && 'dpr-working-test' || 'dpr-working-development'  }}
        run: |
          chmod +x ./.github/scripts/GenerateTestData.main.kts

          # Get AWS account ID from STS
          export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          echo "Using AWS Account: $AWS_ACCOUNT_ID"
          echo "Using DPD folder: $DPD_TEST_RESOURCES_PATH"
          echo "Generating $TEST_DATA_ROW_COUNT rows of test data"
          echo "S3 path $TEST_DATA_S3_PATH"

          kotlin -J-Dorg.slf4j.simpleLogger.defaultLogLevel=error ./.github/scripts/GenerateTestData.main.kts

      - name: Execute SQL in Redshift
        env:
          REDSHIFT_CLUSTER: ${{ inputs.deployEnv == 'test' && 'dpr-redshift-test' || 'dpr-redshift-development'  }}
          S3_BUCKET: ${{ inputs.deployEnv == 'test' && 'dpr-working-test' || 'dpr-working-development' }}
        run: |

          echo "Fetching SQL files from S3..."

          aws s3 ls "s3://${S3_BUCKET}/datahub-test-data/a-generated-sql/" --recursive | \
          awk '{print $4}' | while read SQL_KEY
          do
          
            if [[ "$SQL_KEY" == */ ]]; then
              continue
            fi

            echo "===================================================="
            echo "Processing: $SQL_KEY"
            echo "===================================================="
          
            aws s3 cp "s3://$S3_BUCKET/$SQL_KEY" current.sql
            SQL=$(cat current.sql)

            echo "SQL length: ${#SQL}"
          
            STATEMENT_ID=$(aws redshift-data execute-statement \
              --cluster-identifier "$REDSHIFT_CLUSTER" \
              --database datamart \
              --db-user dpruser \
              --sql "$SQL" \
              --query 'Id' \
              --output text)
            echo "Statement ID: $STATEMENT_ID"
            SUCCESS=false
          
            for i in {1..60}; do
              STATUS=$(aws redshift-data describe-statement \
                --id "$STATEMENT_ID" \
                --query 'Status' \
                --output text)
              echo "Attempt $i/60 - Status: $STATUS"
              if [ "$STATUS" = "FINISHED" ]; then
                echo "Completed: $SQL_KEY"
                SUCCESS=true
                break
              fi

              if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "ABORTED" ]; then
                echo "SQL execution failed: $SQL_KEY"
                aws redshift-data describe-statement \
                  --id "$STATEMENT_ID"
                exit 1
              fi
              sleep 2
            done
          
            if [ "$SUCCESS" = false ]; then
              echo "Timeout waiting for $SQL_KEY"
              exit 1
            fi
          
          done
          
          echo "All SQL files executed successfully."
