name: Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - ready_for_review
      - reopened

jobs:
  json-validation:
    runs-on: ubuntu-latest

    env:
      SCHEMA_1_0_0_LOCATION: "${{ github.workspace }}/schema-1.0.0.json"
      SCHEMA_1_1_0_LOCATION: "${{ github.workspace }}/schema-1.1.0.json"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.x"

      - name: SLSA
        uses: ministryofjustice/devsecops-actions/sca/slsa@7dc13c20e2bf541b8a77fa1320a04983b18846f6 #v1.6.0

      - run: npm ci --ignore-scripts

      - name: Download schema 1.0.0
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/ministryofjustice/hmpps-digital-prison-reporting-data-product-definitions-schema/refs/heads/main/schema/1.0.0/data-product-definition-schema.json -o "$SCHEMA_1_0_0_LOCATION"

      - name: Download schema 1.1.0
        run: curl --fail --silent --show-error https://raw.githubusercontent.com/ministryofjustice/hmpps-digital-prison-reporting-data-product-definitions-schema/refs/heads/main/schema/1.1.0/data-product-definition-schema.json -o "$SCHEMA_1_1_0_LOCATION"

      - name: Validate all the DPDs against the JSON schema
        id: validate-json
        run: npm run validate

      - name: Ensure variant uniqueness within DPDs
        id: ensure-uniqueness
        run: npm run uniqueness
